name: FIDO4VC walt.id image release

# Distinct from the upstream walt.id release.yml (which handles official
# walt.id releases). This one builds and publishes the three FIDO4VC-flavored
# walt.id Docker images to ghcr.io/fido4vc/waltid-{wallet,issuer,verifier}-api
# under semantic-release versioning, driven by conventional commits on this
# fork's release branch.

on:
  push:
    branches: [fido4vc-waltid-poc]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node (for semantic-release)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install release tooling
        run: npm install

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
